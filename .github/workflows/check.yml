name: Verify Takko
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    env:
      CI: "true"
      LUAU_BIN_DIR: .forge/tools/luau
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: ./scripts/setup-luau.ps1
      - run: npx playwright install chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            docs/results/
            playwright-report/
