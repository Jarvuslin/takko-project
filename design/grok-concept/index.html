<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Takko · UI concept</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}header{height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292929}header strong{font-size:14px;font-weight:500}nav{display:flex;gap:5px}button,a{border:1px solid #333;border-radius:18px;padding:8px 15px;background:transparent;color:#aaa;font:12px Arial;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#eee;color:#111;border-color:#eee}main{max-width:1600px;margin:30px auto;padding:0 24px}img{display:block;width:100%;border:1px solid #282828;border-radius:8px}footer{font-size:12px;color:#888;padding:20px 0;display:flex;justify-content:space-between;gap:20px}p{margin:0}a:hover,button:hover{border-color:#888}@media(max-width:750px){header{height:auto;padding:16px;gap:16px;flex-wrap:wrap}main{padding:0 10px;margin:12px auto}footer{flex-direction:column}}</style><header><strong>takko <span style="color:#777">/ Grok-inspired concept</span></strong><nav aria-label="Design screens"><button aria-pressed="true" data-screen="1">01 New game</button><button aria-pressed="false" data-screen="2">02 Workspace</button><button aria-pressed="false" data-screen="3">03 Assets</button></nav><a href="screen-1.svg" download id="download">Download SVG ↗</a></header><main><img src="screen-1.svg" id="screen" alt="Takko new-game screen, dark monochrome style with central composer and recent projects"><footer><p>Design mockup only. Example projects and catalog artwork.</p><p>Original vector assets · Editable Figma import included</p></footer></main><script>const labels=['New game screen','Project workspace and Marketplace','Original icons and artwork'];document.querySelectorAll('button[data-screen]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const n=b.dataset.screen;document.getElementById('screen').src='screen-'+n+'.svg';document.getElementById('screen').alt=labels[n-1];document.getElementById('download').href='screen-'+n+'.svg';}));</script></html>
