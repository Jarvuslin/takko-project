<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Takko · Settings prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#080908;color:#eee;font:13px 'Segoe UI',sans-serif}header{height:48px;display:flex;align-items:center;gap:18px;padding:0 22px}header span{color:#a9aba3}select{margin-left:auto;background:#222;color:#eee;border:1px solid #444;border-radius:7px;padding:7px}main{position:relative;width:min(100%,1280px,calc((100dvh - 100px)*1.6));margin:0 auto;aspect-ratio:1280/800}img{display:block;width:100%}main button{position:absolute;border:0;background:transparent;cursor:pointer}main button:focus-visible{outline:2px solid #bedaff;border-radius:8px}main button:hover{background:#ffffff09;border-radius:9px}footer{padding:16px;text-align:center;color:#888}button[aria-label^="Close dialog"],button[aria-label^="Close route"]{border-radius:0}</style><header><b>Takko / click-through prototype</b><span>Mock data. No connections, saves or generation calls.</span><select aria-label="Preview screen"></select></header><main></main><footer>Use the sidebar and buttons to explore. Form fields are visual examples. Escape closes a dialog.</footer><script type="module">const pages=await(await fetch('screens.json')).json();const select=document.querySelector('select');for(const p of pages){const o=new Option(p.title,p.id);select.add(o)}select.onchange=()=>location.hash=select.value;function render(){const p=pages.find(p=>p.id===location.hash.slice(1))||pages[0];select.value=p.id;const main=document.querySelector('main');main.replaceChildren();const img=new Image();img.src=p.id+'.svg';img.alt=p.title;main.append(img);for(const h of p.hits){const b=document.createElement('button');b.setAttribute('aria-label',h.label);b.style.cssText='left:'+h.x/12.8+'%;top:'+h.y/8+'%;width:'+h.w/12.8+'%;height:'+h.h/8+'%';b.onclick=()=>location.hash=h.to;main.append(b)}document.title=p.title+' · Takko'}addEventListener('hashchange',render);addEventListener('keydown',e=>{if(e.key==='Escape'){const p=pages.find(p=>p.id===location.hash.slice(1));if(p?.back)location.hash=p.back}});render();</script></html>
